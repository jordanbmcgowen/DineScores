name: Pipeline tests

on:
  pull_request:
    paths:
      - 'dinescores_pipeline.py'
      - 'jev_reader.py'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/pipeline-tests.yml'

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install requests
      - run: python -m unittest discover -s tests
      - run: node tests/test_relay.mjs
      - run: python -m py_compile dinescores_pipeline.py jev_reader.py
