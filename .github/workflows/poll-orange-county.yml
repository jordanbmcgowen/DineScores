name: Poll Orange County (daily)

# Orange County's MyHealthDepartment portal answers only its newest 225
# inspections (~1.7 days' worth) and ignores every date filter, so the county
# has to be polled daily; see fetch_orange_county in dinescores_pipeline.py.
# Each run merges the newest 225 into data/orange_county_inspections.jsonl
# (the last ten days of inspections), upserts them into D1 and commits the
# sidecar. data.js is NOT rebuilt here — the Sunday weekly refresh reads the
# same sidecar and rebuilds it, which keeps these daily commits tiny.
on:
  schedule:
    # 05:00 UTC Monday-Saturday; the Sunday weekly refresh covers that day.
    - cron: '0 5 * * 1-6'
  workflow_dispatch:

# Shared with refresh-data.yml so the two jobs never push at the same time.
concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write  # commits the sidecar (and the run's Jev judgments)
      id-token: write  # mints the GitHub OIDC token that authenticates the job
                       # to the portal relay (functions/api/relay.js)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # The tip of main when the job STARTS, not the SHA it was queued
          # with: this job and the weekly refresh share a concurrency group,
          # so a queued run starts after the other has pushed.
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install requests

      - name: Poll the newest Orange County inspections
        env:
          # Same egress as refresh-data.yml: the MyHealthDepartment portal 403s
          # every GitHub-hosted runner, so its requests go through the site's
          # relay function, authenticated with a GitHub OIDC token the job
          # mints itself. The secrets only override the defaults (a different
          # relay URL, a static token, or an HTTP proxy used alongside).
          PORTAL_RELAY_URL: ${{ secrets.PORTAL_RELAY_URL || 'https://dinescores.com/api/relay' }}
          PORTAL_RELAY_TOKEN: ${{ secrets.PORTAL_RELAY_TOKEN }}
          PORTAL_PROXY_URL: ${{ secrets.PORTAL_PROXY_URL }}
          # Same Jev reading as the weekly refresh, so the daily upsert does
          # not flip D1's hazard F and summary phrases back to the regex's
          # reading six days a week (see refresh-data.yml for the policy).
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          JEV_MODE: decide
          JEV_DECIDE: hazard,summary
        run: |
          # The poll records its outcome in a COPY of the freshness file: only
          # the weekly refresh commits data/source_freshness.json, and a
          # modified tracked file would stop the commit step's rebase.
          cp data/source_freshness.json /tmp/oc_freshness.json
          python3 dinescores_pipeline.py \
            --mode weekly \
            --cities orangecounty \
            --output /tmp/oc.json \
            --output-d1-sql /tmp/oc.sql \
            --freshness-file /tmp/oc_freshness.json \
            --deadline-minutes 30 \
            --jev-deadline-minutes 5
        # No --output-data-js on purpose (see the header comment). In weekly
        # mode the fetcher returns the whole sidecar (its last ten days) whose
        # printables have been read, so the D1 upsert is idempotent over that
        # window, an inspection whose PDF is read on a later day ships then,
        # and a missed D1 update heals on the next poll.

      - name: Commit the sidecar
        # BEFORE the D1 update: the newest-225 answer reaches back less than
        # two days, so a sidecar that is not committed today is lost for
        # good, while D1 heals from the committed sidecar on the next poll.
        # The freshness file is NOT committed here (only the weekly refresh
        # commits it), so this commit can never conflict with that one.
        run: |
          git config --global user.name "DineScores Bot"
          git config --global user.email "bot@dinescores.com"
          git add data/orange_county_inspections.jsonl data/jev_judgments
          if git diff --staged --quiet; then
            echo "No changes to the Orange County sidecar — already up to date"
          else
            TIMESTAMP=$(date -u '+%Y-%m-%d')
            git commit -m "Orange County daily poll: ${TIMESTAMP}"
            # Another job (the weekly refresh, a merged PR) may have pushed
            # since checkout: rebase this one commit onto it before pushing.
            git pull --rebase --autostash origin main
            git push origin HEAD:main
            echo "Pushed the Orange County sidecar"
          fi

      - name: Update D1 database
        id: d1
        # A D1 failure must not cost the day's poll (committed above) or hide
        # the poll's own outcome; the last step fails the run if this failed.
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets not configured — skipping D1 update."
            echo "Run the 'Setup D1 Database' workflow prerequisites to enable it."
            exit 0
          fi
          # One-time migration: SQLite has no ADD COLUMN IF NOT EXISTS, so
          # tolerate "duplicate column" once the column exists.
          npx --yes wrangler@4 d1 execute dinescores --remote -y \
            --command "ALTER TABLE inspections ADD COLUMN source_url TEXT" \
            || echo "source_url column already present"
          npx --yes wrangler@4 d1 execute dinescores --remote -y \
            --file /tmp/oc.sql

      - name: Fail the run if the Orange County poll did not refresh
        # Runs LAST, after whatever shipped is committed and in D1, so a red
        # run never costs data. "error" is a fetcher exception, a poll that
        # read nothing (the sidecar's records still shipped) or most
        # printables unreadable; "blocked" the portal refusing us; "skipped"
        # the fetch deadline. A failed D1 update fails the run too.
        env:
          D1_OUTCOME: ${{ steps.d1.outcome }}
        run: |
          python3 - <<'EOF'
          import json, sys
          from datetime import date
          try:
              data = json.load(open('/tmp/oc_freshness.json'))
          except (OSError, ValueError):
              data = {}
          today = date.today().isoformat()
          bad = []
          if 'Orange County' not in data.get('groups', {}):
              bad.append('Orange County: no outcome recorded (pipeline did not reach its output phase)')
          for group, g in sorted(data.get('groups', {}).items()):
              if group != 'Orange County':
                  continue
              run = g.get('last_run') or {}
              if run.get('at') == today and run.get('status') in ('error', 'blocked', 'skipped'):
                  bad.append(f"{group}: {run['status']} - {run.get('detail') or 'no records shipped'}")
              elif run.get('at') != today:
                  bad.append(f"{group}: no outcome recorded today (pipeline did not reach its output phase)")
          import os
          if os.environ.get('D1_OUTCOME') == 'failure':
              bad.append('D1 update failed (the committed sidecar re-upserts it on the next poll)')
          for b in bad:
              print(f'::error title=Source did not refresh::{b}')
          if bad:
              print(f'{len(bad)} problem(s) this run; the sidecar is already committed.')
              sys.exit(1)
          print('Orange County refreshed.')
          EOF
