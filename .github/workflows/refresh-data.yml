name: Refresh DineScores Data

on:
  schedule:
    # Every Sunday at 9:00 AM UTC (3:00 AM CST / 4:00 AM CDT)
    - cron: '0 9 * * 0'
  workflow_dispatch:  # Allow manual trigger from GitHub Actions UI

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write  # Needed to commit data.js back to the repo
      id-token: write  # Lets the job mint the GitHub OIDC token that
                       # authenticates it to the portal relay (functions/api/relay.js)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install requests

      - name: Run data pipeline (all covered metros)
        env:
          # Optional: raises Socrata rate limits if the secret is configured
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
          # Egress for the portals that refuse GitHub's runner ranges. The
          # MyHealthDepartment portal (Dallas, Plano, Frisco, Fort Worth,
          # Tarrant, Portland metro, CO Front Range, Utah County, Yolo) answers
          # 403 to every GitHub-hosted runner type and the Las Vegas (SNHD)
          # API 401s runners after a few dozen pages, so those requests go
          # through the site's own relay function (functions/api/relay.js,
          # deployed with every Pages build). Verified 2026-10-10: Cloudflare's
          # egress gets 200 from both portals. The job authenticates to the
          # relay with a GitHub OIDC token it mints itself (id-token: write
          # above), so NO secret has to exist for this to work. The two
          # secrets below only override the defaults: a different relay URL,
          # or a static token (RELAY_TOKEN Pages variable) instead of OIDC.
          PORTAL_RELAY_URL: ${{ secrets.PORTAL_RELAY_URL || 'https://dinescores.com/api/relay' }}
          PORTAL_RELAY_TOKEN: ${{ secrets.PORTAL_RELAY_TOKEN }}
          # Alternative to the relay: an HTTP proxy (http://user:pass@host:port)
          # for the same requests. When set it is used alongside the relay.
          PORTAL_PROXY_URL: ${{ secrets.PORTAL_PROXY_URL }}
          # Jev violation reader (jev_reader.py). The key is only ever read
          # from this variable; it is scrubbed from logs and exceptions and
          # request bodies are never logged. With the secret unset the reader
          # switches itself off and the regex reads every line as before.
          # JEV_DECIDE names the questions Jev decides; anything not listed
          # stays in shadow (asked and cached, regex decides). Category stays
          # shadow for now: it moves points on the computed-score sources.
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          JEV_MODE: decide
          JEV_DECIDE: hazard,summary
        run: |
          python3 dinescores_pipeline.py \
            --mode weekly \
            --cities chicago nyc sf austin boston seattle florida nys wake vegas la louisville minneapolis cincinnati delaware montgomery detroit sacramento southcarolina fairfax portland coloradosprings larimer weld adams utahcounty yolo santaclara sandiego omaha houston dc dallas plano frisco fort-worth-texas tarrant arlington richardson \
            --output /tmp/dinescores_data.json \
            --output-data-js public/data.js \
            --merge-existing-data-js public/data.js \
            --output-d1-sql /tmp/dinescores_weekly.sql \
            --freshness-file data/source_freshness.json \
            --deadline-minutes 240 \
            --jev-deadline-minutes 20
        # --jev-deadline-minutes bounds the Jev reading pass that runs after
        # the fetch phase (240 + 20 + outputs and the D1 upload stay inside
        # the 330-minute job). Lines not read by then fall back to the regex;
        # the pass can never fail the run or drop a record.
        # --merge-existing-data-js is essential: weekly mode only pulls the
        # recent window, and merging preserves the accumulated dataset instead
        # of overwriting it. Fetches are failure-tolerant — if a portal blocks
        # the runner, its existing records are kept via the merge.
        # --freshness-file records each source's newest shipped inspection and
        # last-run outcome; weekly runs look back from that date (bounded) so a
        # week lost to a timeout, a block, or a source that publishes in
        # batches refetches itself the next time the source answers. The same
        # file feeds the "Report source outcomes" step below.
        # --deadline-minutes keeps the fetch phase inside the job timeout:
        # sources that miss the budget are skipped (their existing records
        # survive via the merge) instead of the whole run timing out and
        # shipping nothing. The budget is what bounds the MHD detail-page
        # ban cooldowns (15 min each; a normal week across every MHD
        # jurisdiction needs five or more, and a backlog needs more) — this
        # is a Sunday-morning cron, so a four-hour fetch phase costs nothing
        # but runner minutes.

      - name: Show data summary
        run: |
          python3 -c "
          import json
          with open('public/data.js') as f:
              content = f.read()
          # Extract the JSON part
          data = json.loads(content.split('window.DATA = ', 1)[1].rstrip(';\n'))
          from collections import Counter
          cities = Counter(r['c'] for r in data)
          print(f'Total restaurants: {len(data)}')
          for city, count in sorted(cities.items()):
              print(f'  {city}: {count}')
          "

      - name: Report source outcomes
        # A green job used to hide sources that answered nothing for weeks.
        # This renders each fetch group's outcome into the run summary and
        # raises a warning annotation for any that failed this run or whose
        # newest inspection is older than three weeks.
        run: |
          python3 - <<'EOF'
          import json, os
          from datetime import date, datetime

          STALE_DAYS = 21
          today = date.today()
          try:
              data = json.load(open('data/source_freshness.json'))
          except FileNotFoundError:
              print('data/source_freshness.json not written — pipeline step did not reach its output phase')
              raise SystemExit(0)
          rows, warnings = [], []
          for group, g in sorted(data.get('groups', {}).items()):
              run = g.get('last_run') or {}
              ran_today = run.get('at') == today.isoformat()
              latest = g.get('latest') or ''
              age = (today - datetime.strptime(latest, '%Y-%m-%d').date()).days if latest else None
              status = run.get('status', '-') if ran_today else f"not run (last: {run.get('status', '-')} {run.get('at', '')})"
              flag = ''
              if ran_today and run.get('status') in ('error', 'blocked', 'skipped'):
                  flag = 'FAILED'
                  warnings.append(f"{group}: {run['status']} - {run.get('detail') or 'no records shipped'}")
              elif age is not None and age > STALE_DAYS:
                  flag = 'STALE'
                  # A source can be stale because we could not read it or
                  # because it published nothing; the fetcher's note says which.
                  note = f" - {run['detail']}" if ran_today and run.get('detail') else ''
                  warnings.append(f"{group}: newest inspection is {age} days old ({latest}){note}")
              rows.append(f"| {group} | {status} | {run.get('records', '-') if ran_today else '-'} | "
                          f"{latest or '-'} | {'-' if age is None else age} | {flag} |")
          lines = ['## Weekly refresh: source outcomes', '',
                   '| Source group | This run | Records | Newest inspection | Age (days) | Flag |',
                   '|---|---|---|---|---|---|'] + rows
          if warnings:
              lines += ['', '### Needs attention', ''] + [f'- {w}' for w in warnings]
          else:
              lines += ['', 'Every source answered and is current.']
          # Jev reader coverage: what was judged, what came from the cache,
          # what fell back to the regex and why, and what Jev decided
          # differently from the regex on the F question.
          jev = data.get('jev')
          if jev:
              lines += ['', '### Jev violation reader', '']
              if jev.get('status') == 'error':
                  lines += [f"- FAILED: {jev.get('error')} (every line read by the regex this run)"]
                  warnings.append(f"Jev pass failed: {jev.get('error')}")
              else:
                  r = jev.get('reader') or {}
                  dec = jev.get('decisions') or {}
                  fvr = jev.get('f_vs_regex') or {}
                  lines += [
                      f"- mode `{jev.get('mode')}`, deciding `{', '.join(jev.get('decide') or []) or 'nothing (shadow)'}`; "
                      f"model `{jev.get('model')}`, question set `{jev.get('question_set')}`",
                      f"- lines: {jev.get('lines', 0)} in {jev.get('records_with_violations', 0)} inspections "
                      f"({jev.get('distinct_texts', 0)} distinct texts); {r.get('lines_cached', 0)} from cache, "
                      f"{r.get('lines_judged', 0)} judged this run, {r.get('lines_fallback', 0)} fell back",
                      f"- requests: {r.get('requests', 0)} ({r.get('request_failures', 0)} failed), "
                      f"{r.get('input_tokens', 0):,} input tokens, hazards re-asked alone {r.get('hazard_verified_alone', 0)}",
                      '- decisions: ' + ', '.join(f"{q} {d.get('jev', 0)} Jev / {d.get('regex', 0)} regex" for q, d in dec.items()),
                      f"- F against the regex on judged inspections: {fvr.get('agree', 0)} agree, "
                      f"{fvr.get('regex_only', 0)} regex-only F, {fvr.get('jev_only', 0)} Jev-only F",
                      f"- re-tiered lines {jev.get('retiered_lines', 0)}, re-scored inspections {jev.get('rescored_records', 0)}, "
                      f"record errors {jev.get('record_errors', 0)}; cache file {jev.get('cache_file') or 'none (nothing new)'}; "
                      f"{jev.get('elapsed_s', 0)} s",
                  ]
                  for reason, n in sorted((r.get('fallback_reasons') or {}).items(), key=lambda kv: -kv[1]):
                      lines.append(f'- fallback: {n} lines, {reason}')
                  total = jev.get('lines') or 0
                  if total and r.get('lines_fallback', 0) > total / 2:
                      warnings.append(f"Jev reader fell back on {r.get('lines_fallback')} of {total} lines")
          text = '\n'.join(lines) + '\n'
          print(text)
          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary_path:
              with open(summary_path, 'a') as f:
                  f.write(text)
          for w in warnings:
              print(f'::warning title=Refresh source needs attention::{w}')
          EOF

      - name: Update D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets not configured — skipping D1 update."
            echo "Run the 'Setup D1 Database' workflow prerequisites to enable it."
            exit 0
          fi
          # One-time migration: SQLite has no ADD COLUMN IF NOT EXISTS, so
          # tolerate "duplicate column" once the column exists.
          npx --yes wrangler@4 d1 execute dinescores --remote -y \
            --command "ALTER TABLE inspections ADD COLUMN source_url TEXT" \
            || echo "source_url column already present"
          npx --yes wrangler@4 d1 execute dinescores --remote -y \
            --file /tmp/dinescores_weekly.sql

      - name: Commit updated data.js
        run: |
          git config --global user.name "DineScores Bot"
          git config --global user.email "bot@dinescores.com"
          # The Jev cache travels with the data it graded: the run's new
          # judgments file (append-only; see data/jev_judgments/README.md).
          git add public/data.js data/source_freshness.json data/jev_judgments
          if git diff --staged --quiet; then
            echo "No changes to data.js — already up to date"
          else
            TIMESTAMP=$(date -u '+%Y-%m-%d')
            git commit -m "Auto-refresh: ${TIMESTAMP} weekly inspection data update"
            git push
            echo "Successfully pushed updated data.js"
          fi

      - name: Fail the run if any source did not refresh
        # Runs LAST, after everything that did ship is committed and in D1,
        # so a red run never costs data. For weeks a blocked portal shipped
        # zero records while the job stayed green and nobody was told; a
        # failed run notifies the repository owner. "error" is a fetcher
        # exception, "blocked" the portal refusing us, "skipped" the fetch
        # deadline. A source that answered but has published nothing new
        # ("empty", flagged STALE above with the fetcher's note) is not a
        # failure of this job.
        run: |
          python3 - <<'EOF'
          import json, sys
          from datetime import date
          data = json.load(open('data/source_freshness.json'))
          today = date.today().isoformat()
          bad = []
          for group, g in sorted(data.get('groups', {}).items()):
              run = g.get('last_run') or {}
              if run.get('at') == today and run.get('status') in ('error', 'blocked', 'skipped'):
                  bad.append(f"{group}: {run['status']} - {run.get('detail') or 'no records shipped'}")
          for b in bad:
              print(f'::error title=Source did not refresh::{b}')
          if bad:
              print(f'{len(bad)} source group(s) did not refresh this run; data that did ship is already committed.')
              sys.exit(1)
          print('Every source group refreshed.')
          EOF
