name: Probe data sources

# Diagnostic only — nothing is written. Reports which inspection portals
# answer from each GitHub-hosted runner type, because some portals block
# runner IP ranges (the weekly refresh then logs 403s and ships nothing for
# those metros while the job stays green). Run it from the Actions tab when
# the refresh summary flags a source, or after configuring PORTAL_PROXY_URL
# to confirm the proxy reaches the MyHealthDepartment portal.
#
# Probed 2026-09-07: MHD returned 403 from ubuntu, macOS AND windows runners
# (search and detail pages alike); the SNHD, Socrata and Tyler endpoints
# answered from all three. Probed 2026-11-23 (run 45194249225): the sources
# added on 2026-11-22 (El Paso, Waco, Garland, Corpus Christi, Abilene,
# Wichita Falls, Paragon) answered 200 from the ubuntu and macOS runners, and
# a Montana printable that the portal took 23 s to build came back through
# the relay as a PDF.

on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      id-token: write   # to mint the OIDC token the relay accepts
    env:
      PORTAL_PROXY_URL: ${{ secrets.PORTAL_PROXY_URL }}
      # The site's relay function is the default (see refresh-data.yml); the
      # secrets only override it.
      PORTAL_RELAY_URL: ${{ secrets.PORTAL_RELAY_URL || 'https://dinescores.com/api/relay' }}
      PORTAL_RELAY_TOKEN: ${{ secrets.PORTAL_RELAY_TOKEN }}
    steps:
      - name: Mint a relay credential (GitHub OIDC) when no static token is set
        if: env.PORTAL_RELAY_TOKEN == ''
        shell: bash
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=dinescores-portal-relay" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("value",""))')
          echo "::add-mask::$TOKEN"
          echo "PORTAL_RELAY_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "minted an OIDC token for the relay (${#TOKEN} chars)"
      - name: Probe portals
        shell: bash
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/133.0.0.0 Safari/537.36'
          echo "runner egress IP: $(curl -s --max-time 20 https://api.ipify.org || echo unknown)"
          WEEK_AGO=$(python3 -c "import datetime; print((datetime.date.today()-datetime.timedelta(days=7)).isoformat())")
          TODAY=$(python3 -c "import datetime; print(datetime.date.today().isoformat())")
          MHD_SEARCH="{\"data\":{\"path\":\"dallas\",\"programName\":\"\",\"filters\":{\"date\":\"$WEEK_AGO to $TODAY\",\"purpose\":\"\"},\"start\":0,\"count\":25,\"searchStr\":\"\",\"lat\":0,\"lng\":0,\"sort\":{}},\"task\":\"searchInspections\"}"
          probe() {  # label, url, extra curl args...
            local label="$1"; shift
            local code
            code=$(curl -s -o probe_body.txt -w '%{http_code}' --max-time 60 -A "$UA" "$@" || echo "curl-error")
            echo "$label: HTTP $code | $(head -c 100 probe_body.txt | tr '\n\r' '  ')"
          }
          mhd_search() {  # extra curl args (e.g. a proxy)
            probe "MHD search (Dallas)$1" https://inspections.myhealthdepartment.com/ \
              -H 'Content-Type: application/json' -H 'Accept: application/json, text/plain, */*' \
              -H 'Origin: https://inspections.myhealthdepartment.com' \
              -H 'Referer: https://inspections.myhealthdepartment.com/' \
              --data "$MHD_SEARCH" "${@:2}"
          }
          mhd_search ""
          probe "MHD detail page (Dallas)" 'https://inspections.myhealthdepartment.com/dallas/inspection/?inspectionID=D7B6D725-9E94-48F9-B16D-2FF67040CCA2'
          probe "SNHD list (Las Vegas)" 'https://www.southernnevadahealthdistrict.org/wp-json/snhd-eh-restaurants/v1/restaurants?per_page=1&page=1'
          probe "King County (r878-4sxa)" 'https://data.kingcounty.gov/resource/r878-4sxa.json?$limit=1'
          probe "Austin Socrata" 'https://datahub.austintexas.gov/resource/ecmv-9xxi.json?$limit=1'
          probe "NY State Socrata" 'https://health.data.ny.gov/resource/cnih-y5dw.json?$limit=1'
          probe "Houston Tyler portal" 'https://houston-tx.healthinspections.us/'
          # Sources added 2026-11. Probed only from a cloud container before
          # shipping; this is where GitHub-runner reachability gets settled.
          # A block here means the host must join the relay's allowlist
          # (functions/api/relay.js) and the fetcher must route through it.
          probe "Georgia Tyler publicportals" 'https://ga.healthinspections.us/stateofgeorgia/API/index.cfm/facilities/0' -H 'Accept: application/json'
          probe "Louisiana Tyler publicportals" 'https://la.healthinspections.us/API/index.cfm/facilities/0' -H 'Accept: application/json'
          probe "Maricopa County envapp" 'https://envapp.maricopa.gov/'
          probe "Maricopa County ArcGIS" 'https://services.arcgis.com/ykpntM6e3tHvzKRJ/arcgis/rest/services/Restaurant_(External)/FeatureServer/0?f=json'
          probe "Harris County HCPH portal" 'https://secureweb.hcphtx.org/fspportal/'
          probe "Pima County Hedgerow portal" 'https://healthinspect.pima.gov/portal/'
          probe "Lubbock Hedgerow portal" 'https://clhd-portal.hedgerowsoftware.com/'
          probe "Mesquite Hedgerow portal" 'https://mesquite.hedgerowsoftware.com/'
          probe "WCCHD inspection zip" 'https://storage.googleapis.com/ehyelp/WCCHD%20Food%20Inspections.zip' -r 0-200
          probe "MHD Fort Bend page" 'https://inspections.myhealthdepartment.com/fbceh'
          probe "MHD Cuyahoga page" 'https://inspections.myhealthdepartment.com/ccbh'
          probe "MHD VDH Richmond page" 'https://inspections.myhealthdepartment.com/va-richmond'
          # Sources added 2026-11-22. El Paso's form sits behind Cloudflare,
          # which is the likeliest of these to start refusing a runner (it
          # answered 200 on 2026-11-23).
          probe "El Paso food scores form" 'https://foodscores.elpasotexas.gov/'
          probe "Waco ArcGIS view" 'https://services2.arcgis.com/oUXiR7ziAPAzGw6X/arcgis/rest/services/foodScoresView/FeatureServer/0/query?where=1%3D1&returnCountOnly=true&f=json'
          probe "Garland MapServer" 'https://maps2.garlandtx.gov/server2/rest/services/Health/Restaurant_Scores/MapServer/4?f=json'
          probe "Corpus Christi InspectHub" 'https://app.inspecthub.com/public/remote.cfm'
          probe "Abilene EnerGov" 'https://cityofabilenetx-energovweb.tylerhost.net/apps/civic-access-public/'
          probe "Wichita Falls Hedgerow portal" 'https://wfeh-portal.hedgerowsoftware.com/'
          probe "Paragon Inspections Online (Missoula)" 'https://www.inspectionsonline.us/foodsafety/mtmissoulamissoula/search.htm'
          probe "MHD Montana page" 'https://inspections.myhealthdepartment.com/montana'
          if [ -n "$PORTAL_PROXY_URL" ]; then
            echo "PORTAL_PROXY_URL is configured — repeating the blocked-portal probes through it"
            mhd_search " via proxy" -x "$PORTAL_PROXY_URL"
            probe "MHD detail page (Dallas) via proxy" -x "$PORTAL_PROXY_URL" 'https://inspections.myhealthdepartment.com/dallas/inspection/?inspectionID=D7B6D725-9E94-48F9-B16D-2FF67040CCA2'
            probe "SNHD list (Las Vegas) via proxy" -x "$PORTAL_PROXY_URL" 'https://www.southernnevadahealthdistrict.org/wp-json/snhd-eh-restaurants/v1/restaurants?per_page=1&page=1'
          else
            echo "PORTAL_PROXY_URL not configured — skipping proxy probes"
          fi
          if [ -n "$PORTAL_RELAY_URL" ]; then
            echo "PORTAL_RELAY_URL is configured — repeating them through the relay function"
            # The relay takes the target in a url= parameter rather than as a
            # proxy, so the portal's own status comes back as the Worker's.
            relay() {  # label, target url, extra curl args...
              local label="$1" target="$2"; shift 2
              local enc
              enc=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$target")
              probe "$label" "${PORTAL_RELAY_URL}?url=${enc}" -H "X-Relay-Token: $PORTAL_RELAY_TOKEN" "$@"
            }
            relay "MHD search (Dallas) via relay" 'https://inspections.myhealthdepartment.com/'               -H 'Content-Type: application/json' -H 'Accept: application/json, text/plain, */*'               -H 'Origin: https://inspections.myhealthdepartment.com'               -H 'Referer: https://inspections.myhealthdepartment.com/'               --data "$MHD_SEARCH"
            relay "MHD detail page (Dallas) via relay" 'https://inspections.myhealthdepartment.com/dallas/inspection/?inspectionID=D7B6D725-9E94-48F9-B16D-2FF67040CCA2'
            relay "SNHD list (Las Vegas) via relay" 'https://www.southernnevadahealthdistrict.org/wp-json/snhd-eh-restaurants/v1/restaurants?per_page=1&page=1'
            # Montana's clean inspections ship only on their printable PDF,
            # which the portal builds on request (~20 s the first time): this
            # is the one relayed request that slow. Expect HTTP 200 and %PDF.
            relay "MHD Montana printable via relay" 'https://inspections.myhealthdepartment.com/montana/print/?task=getPrintable&path=montana&pKey=A8098F4F-EFE4-4ADC-9476-35A4870FA27C,A8098F4F-EFE4-4ADC-9476-35A4870FA27C'
            echo "A 403 here with a 200 direct from a non-GitHub host means the"
            echo "portal refused Cloudflare's TLS fingerprint, not the IP."
          else
            echo "PORTAL_RELAY_URL not configured — skipping relay probes"
          fi
